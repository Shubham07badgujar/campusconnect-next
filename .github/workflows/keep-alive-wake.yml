# Morning wake-up call for the Render free tier: the in-app keep-alive
# scheduler (src/lib/server/keep-alive.ts) holds the service awake from
# 07:00 to 23:45 IST, but a process that slept overnight cannot ping itself
# awake — this workflow revives it each morning of the 5-day window.
# Cron has no year field, so the date guard below makes every run outside
# 2026-09-23..2026-09-27 a no-op; the file can be deleted after that.
name: keep-alive-wake

on:
  schedule:
    - cron: "30 1 23-27 9 *" # 07:00 IST on Sep 23-27
    - cron: "50 1 23-27 9 *" # 07:20 IST backup (GitHub cron can run late)
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app (only during the 5-day window)
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%Y%m%d)
          if [ "$TODAY" -lt 20260923 ] || [ "$TODAY" -gt 20260927 ]; then
            echo "Outside the keep-alive window ($TODAY); nothing to do."
            exit 0
          fi
          # Generous timeout + retries: a cold start on the free tier can take ~1 min.
          curl -fsS --max-time 120 --retry 5 --retry-delay 20 --retry-all-errors \
            "https://campusconnect-next.onrender.com/api/keep-alive" || true
          echo "Wake-up ping sent."
