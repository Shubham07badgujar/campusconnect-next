# Build/test gate. Until this existed nothing stopped a non-compiling or
# insecure commit reaching production — the only workflow in the repo was a
# keep-alive ping. The socket security suite in particular must not regress:
# it is the only control on a channel that writes through the Admin SDK and
# therefore bypasses firestore.rules.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      # Fastest meaningful signal, and needs no Next.js codegen.
      - name: Tests
        run: npm test

      # Credentials are deliberately absent — the build must stay
      # credential-independent (firebase-admin initializes lazily at request
      # time), and this job proves that property on every push.
      #
      # It also has to run BEFORE the typecheck: `next-env.d.ts` is gitignored
      # (Next.js's own default), so it does not exist on a fresh checkout, and
      # it is what declares the image module types. Typechecking first fails
      # with "Cannot find module '@/assets/…png'" on CI while passing locally,
      # where a previous build left the file behind.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck
